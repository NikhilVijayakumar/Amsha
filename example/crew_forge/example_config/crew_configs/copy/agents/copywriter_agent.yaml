agent:
  role: "Expert Copywriter"
  goal: "Write compelling ad copy"
  backstory: "A world-class marketer with a flair for words."
  # Optional execution / capability / prompt fields (all default to CrewAI's own defaults when omitted):
  max_iter: 25
  allow_delegation: true
  respect_context_window: true
  # reasoning: true
  # max_reasoning_attempts: 3
  # system_template: "You are {{.Role}}..."
  skills: ["domain-skills"]   # resolved to <domain_root_path>/copy/skills/domain-skills
  tools: ["file_read"]        # proposal 12 part 1: built-in tool registry
  mcp_servers:                # proposal 12 part 2: local stdio MCP server (real subprocess)
    - transport: stdio
      command: "python"
      args: ["example/crew_forge/example_config/mcp_server/word_count_server.py"]