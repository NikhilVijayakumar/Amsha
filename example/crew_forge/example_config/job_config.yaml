crew_name: "Copy Crew"
usecase: "copy"
module_name: "copy"
output_filepath: ".Amsha/output/intermediate/crew/crew_configurations.json"

crews:
  copy_crew:
    memory: true
    # proposal 13: explicit opt-out (default is None/off either way). Set true only
    # after a `crewai login` -- it sends full prompts/responses to app.crewai.com.
    tracing: false
    checkpoint:
      enabled: true
      provider: json
      location: "./.Amsha/execution/checkpoints"
      on_events: ["task_completed"]
      max_checkpoints: 5
    knowledge_sources:
      - "./example/crew_forge/example_config/crew_configs/copy/knowledge/products.json"
#    knowledge_sources:
#      - "./docs/shared_project_guidelines.md"
#      - "./docs/style_guide.txt"
#    input:
#      source: "file"
#      path: "E:/Python/data/raw/features.json"
    steps:
      - task_key: "ad_copy_task"
        agent_key: "copywriter_agent"
        knowledge_sources:
          - "./example/crew_forge/example_config/crew_configs/copy/knowledge/products.json"
#    knowledge_sources:
#      - "./data/market_research_summary.csv"
#      - "./data/competitor_analysis.pdf"
#      - "./data/user_feedback.txt"


pipeline:
  - "copy_crew"

