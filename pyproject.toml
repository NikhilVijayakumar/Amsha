[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Amsha"
version = "2.11.3"
description = "Amsha is a lightweight library designed to provide common configuration and helper utilities for CrewAI orchestration. It serves as a foundational component for building scalable and maintainable AI agent systems"
requires-python = ">=3.12,<3.14"
dependencies = [
     "PyYAML ==6.0.3",
     "crewai == 1.15.18",
     "crewai-tools == 1.15.18",
     "dependency-injector == 4.48.2",
     "pandas == 2.3.2",
     "openpyxl == 3.1.5",
     "pydantic == 2.11.9",
     "docling == 2.53.0",
     "psutil == 7.1.3",
     "chardet == 5.2.0",
     "nvidia-ml-py == 13.580.82",
     "litellm>=1.99.0",
]

[project.optional-dependencies]
research = [
    "scikit-learn >= 1.3.0",
    "matplotlib >= 3.7.0",
    "seaborn >= 0.12.0",
    "jupyter >= 1.0.0"
]

[tool.setuptools]
package-dir = { "" = "src/nikhil" }

[tool.setuptools.packages.find]
where = ["src/nikhil"]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
