[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amsha-mcp"
version = "0.1.0"
description = "MCP server exposing Amsha's features, modules, and crew-design methodology (stdlib fastMCP)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=1.0.0,<2",
]

[project.scripts]
amsha-mcp = "amsha_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]